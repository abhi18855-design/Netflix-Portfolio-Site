# Visual content editor: https://app.pagescms.org
media:
  - name: images
    label: Images
    input: public/media/images
    output: /media/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - svg
    rename: safe
  - name: audio
    label: Audio
    input: public/media/audio
    output: /media/audio
    extensions:
      - mp3
      - wav
      - ogg
      - m4a
    rename: safe
  - name: documents
    label: Documents
    input: public/media/documents
    output: /media/documents
    extensions:
      - pdf
    rename: safe
content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: create
    view:
      primary: title
      fields:
        - title
        - category
        - year
        - published
        - order
      sort:
        - order
        - year
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          message: Use lowercase words joined by hyphens, such as my-first-film.
        description: Unique project address. Changing this changes the public URL.
      - name: description
        label: Short description
        type: text
        required: true
        options:
          maxlength: 320
      - name: category
        label: Project category
        type: reference
        options:
          collection: categories
          value: "{fields.slug}"
          label: "{fields.name}"
          multiple: false
        required: true
      - name: year
        label: Project year
        type: number
        required: true
      - name: cover
        label: Cover image
        type: image
        options:
          media: images
        required: true
      - name: coverAlt
        label: Cover image description
        type: string
        description: Describe the image for people using screen readers.
      - name: hero
        label: Hero image (optional)
        type: image
        options:
          media: images
      - name: published
        label: Publish project
        type: boolean
        description: Turn on when ready. Turning off removes the page from the next
          deployment; source files and uploads remain in GitHub.
      - name: featured
        label: Include in selected work
        type: boolean
      - name: demo
        label: Demonstration project
        type: boolean
        description: Leave off for your own creative work.
      - name: order
        label: Display order
        type: number
        description: Lower numbers appear first. Defaults to 100 if omitted.
      - name: role
        label: Your role
        type: string
      - name: youtube
        label: YouTube link
        type: string
        description: Paste a watch, share, Shorts, live, or embed URL. Invalid links
          will not display a player.
      - name: body
        label: Full project description
        type: rich-text
        options:
          format: markdown
          media: images
      - name: gallery
        label: Upload frames
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: images
            required: true
          - name: alt
            label: Image description
            type: string
          - name: caption
            label: Caption
            type: string
      - name: audio
        label: Upload audio
        type: object
        list: true
        fields:
          - name: title
            label: Track title
            type: string
            required: true
          - name: file
            label: Audio file
            type: file
            options:
              media: audio
              extensions:
                - mp3
                - wav
                - ogg
                - m4a
            description: Upload audio, or leave empty if using an external listening link.
          - name: description
            label: Track description
            type: text
          - name: cover
            label: Track cover
            type: image
            options:
              media: images
          - name: external
            label: External listening link
            type: string
      - name: credits
        label: Credits & project information
        type: object
        list: true
        fields:
          - name: label
            label: Credit / information label
            type: string
            required: true
            description: Director, client, collaborators, tools, or production details.
          - name: value
            label: Name or detail
            type: string
            required: true
      - name: links
        label: External links
        type: object
        list: true
        fields:
          - name: label
            label: Link label
            type: string
            required: true
          - name: url
            label: Link URL
            type: string
            required: true
  - name: site
    label: Website settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Portfolio name
        type: string
        required: true
      - name: wordmark
        label: Navigation wordmark
        type: string
        required: true
      - name: description
        label: Website description
        type: text
        required: true
      - name: introduction
        label: Homepage introduction
        type: text
      - name: featuredProject
        label: Featured hero project
        type: reference
        options:
          collection: projects
          value: "{fields.slug}"
          label: "{fields.title}"
          multiple: false
      - name: email
        label: Contact email
        type: string
        required: true
      - name: location
        label: Location
        type: string
      - name: availability
        label: Availability
        type: string
      - name: contactTitle
        label: Contact headline
        type: string
        required: true
      - name: contactIntro
        label: Contact introduction
        type: text
      - name: footerNote
        label: Footer statement
        type: string
      - name: accent
        label: Accent color
        type: string
        required: true
        pattern: ^#[0-9a-fA-F]{6}$
        description: "Six-digit color, for example #B9232C."
      - name: socials
        label: Social & professional links
        type: object
        list: true
        fields:
          - name: label
            label: Link label
            type: string
            required: true
          - name: url
            label: Link URL
            type: string
            required: true
  - name: about
    label: About me
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: title
        label: About headline
        type: string
        required: true
      - name: introduction
        label: Introduction
        type: text
      - name: biography
        label: Biography
        type: text
      - name: background
        label: Creative background & experience
        type: text
      - name: philosophy
        label: Creative philosophy
        type: text
      - name: portrait
        label: Portrait
        type: image
        options:
          media: images
      - name: portraitAlt
        label: Portrait description
        type: string
      - name: disciplines
        label: Creative disciplines
        type: string
        list: true
      - name: resume
        label: Résumé
        type: file
        options:
          media: documents
          extensions:
            - pdf
      - name: links
        label: External links
        type: object
        list: true
        fields:
          - name: label
            label: Link label
            type: string
            required: true
          - name: url
            label: Link URL
            type: string
            required: true
  - name: categories
    label: Project categories
    type: collection
    path: src/content/categories
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: name
      fields:
        - name
        - slug
        - order
    fields:
      - name: name
        label: Category name
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          message: Use lowercase words joined by hyphens, such as my-first-film.
        description: Keep this stable when renaming a category. Reassign projects before
          deleting a category.
      - name: description
        label: Category introduction
        type: text
      - name: order
        label: Category order
        type: number
